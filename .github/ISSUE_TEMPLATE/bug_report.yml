name: Bug report
description: Something in IK CRM doesn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: role
    attributes:
      label: Signed in as
      options: [Admin, GTM, Delivery and talent, Finance (read)]
    validations: { required: true }
  - type: input
    id: page
    attributes: { label: Page, placeholder: 'e.g. #deal-d_nw_fpa or Deals > Table' }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: "1. Go to …\n2. Click …\n3. See …" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual result }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser and device }
