# Nightly heavy run: 5x data volume for performance tests and repeated e2e runs to surface flaky tests.
name: Nightly stress

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      scale:
        description: Data multiplier (1 = 10k contacts and 5k deals; 100 = 1M contacts and 500k deals)
        type: choice # a fixed list, so a typo like 300 can't crash the run
        options: ['1', '5', '10', '25', '50', '100']
        default: '5'
      repeat:
        description: How many times to repeat each browser test
        type: choice
        options: ['1', '3', '5', '10']
        default: '5'

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx vitest run tests/unit/performance.test.js
        env:
          STRESS_SCALE: '${{ inputs.scale || 5 }}'
          NODE_OPTIONS: --max-old-space-size=6144 # runners have 16 GB RAM; Node's default limit is about 4 GB

  flaky-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }} --repeat-each=${{ inputs.repeat || 5 }} --retries=0 # no retries: we want to see flakes
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: 'stress-report-${{ matrix.project }}', path: playwright-report/, retention-days: 14 }
